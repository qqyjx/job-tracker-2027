<style>
  :root{
    --paper:#f5f7fa;
    --surface:#ffffff;
    --surface-2:#fafbfd;
    --ink:#171a2b;
    --ink-2:#474d63;
    --muted:#79809a;
    --line:#e2e6ef;
    --line-2:#eef1f7;
    --accent:#2f4b7c;
    --accent-soft:#e9eef7;
    --urgent:#a93c10;
    --urgent-soft:#fbeae2;
    --ok:#26644a;
    --ok-soft:#e2efe8;
    --warn:#7d5a10;
    --warn-soft:#f7efd9;
    --skip-soft:#eef0f4;
    --shadow:0 1px 2px rgba(23,26,43,.05), 0 8px 24px -12px rgba(23,26,43,.18);
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0e1017;
      --surface:#171a24;
      --surface-2:#1c202b;
      --ink:#e7eaf3;
      --ink-2:#aeb5c8;
      --muted:#7a8195;
      --line:#282d3b;
      --line-2:#222733;
      --accent:#93aeda;
      --accent-soft:#1d2534;
      --urgent:#e5825e;
      --urgent-soft:#2d1a13;
      --ok:#79bf99;
      --ok-soft:#14261e;
      --warn:#d2af66;
      --warn-soft:#282113;
      --skip-soft:#20242f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1017;
    --surface:#171a24;
    --surface-2:#1c202b;
    --ink:#e7eaf3;
    --ink-2:#aeb5c8;
    --muted:#7a8195;
    --line:#282d3b;
    --line-2:#222733;
    --accent:#93aeda;
    --accent-soft:#1d2534;
    --urgent:#e5825e;
    --urgent-soft:#2d1a13;
    --ok:#79bf99;
    --ok-soft:#14261e;
    --warn:#d2af66;
    --warn-soft:#282113;
    --skip-soft:#20242f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:32px 24px 72px}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:24px;flex-wrap:wrap;
    padding-bottom:18px;border-bottom:2px solid var(--ink);
  }
  h1{
    margin:0;font-size:27px;font-weight:600;letter-spacing:-.4px;
    text-wrap:balance;
  }
  .sub{margin:5px 0 0;color:var(--muted);font-size:13px}
  .updated{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    text-align:right;line-height:1.5;
  }
  .updated b{display:block;color:var(--ink-2);font-weight:500;font-size:12px}

  /* ---------- summary ---------- */
  .summary{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:1px;background:var(--line);border:1px solid var(--line);
    margin:22px 0 0;border-radius:8px;overflow:hidden;
  }
  .stat{background:var(--surface);padding:14px 16px}
  .stat .n{
    font-family:var(--mono);font-size:24px;font-weight:600;
    line-height:1.1;font-variant-numeric:tabular-nums;
  }
  .stat .k{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
  .stat.is-applied .n{color:var(--ok)}
  .stat.is-pending .n{color:var(--accent)}
  .stat.is-soon .n{color:var(--urgent)}

  /* ---------- alerts ---------- */
  .alerts{margin:16px 0 0;display:flex;flex-direction:column;gap:8px}
  .alert{
    display:flex;gap:10px;align-items:baseline;
    padding:11px 14px;border-radius:7px;font-size:13px;
    border-left:3px solid;
  }
  .alert.quota{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .alert.soon{background:var(--urgent-soft);border-color:var(--urgent);color:var(--urgent)}
  .alert .tag{
    font-family:var(--mono);font-size:10.5px;font-weight:600;
    letter-spacing:.6px;text-transform:uppercase;flex-shrink:0;opacity:.85;
  }
  .alert span{color:var(--ink-2)}
  .alert.quota span,.alert.soon span{color:inherit;opacity:.92}

  /* ---------- groups ---------- */
  .group{margin-top:34px}
  .group-head{
    display:flex;align-items:baseline;gap:10px;
    padding-bottom:8px;margin-bottom:0;
    border-bottom:1px solid var(--line);
  }
  .group-head h2{
    margin:0;font-size:14.5px;font-weight:600;letter-spacing:.1px;
  }
  .group-head .count{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .group-head .hint{
    margin-left:auto;font-size:12px;color:var(--muted);
  }

  .rows{display:flex;flex-direction:column}
  .row{
    display:grid;
    grid-template-columns:3px minmax(0,1fr) 84px 96px 92px;
    gap:0 14px;align-items:center;
    padding:11px 12px 11px 0;
    border-bottom:1px solid var(--line-2);
    background:var(--surface);
  }
  .row:hover{background:var(--surface-2)}
  .row.done{opacity:.62}
  .row.skipped{opacity:.42}

  .pri{align-self:stretch;border-radius:2px;background:transparent}
  .pri.high{background:var(--accent)}
  .pri.mid{background:var(--line)}
  .pri.low{background:transparent}

  .who{min-width:0;padding-left:11px}
  .org{font-size:11.5px;color:var(--muted);letter-spacing:.15px}
  .role{
    font-size:14px;font-weight:500;color:var(--ink);
    margin-top:1px;overflow-wrap:anywhere;
  }
  .role a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
  .role a:hover{border-color:var(--accent);color:var(--accent)}
  .why{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}

  .city{font-size:12.5px;color:var(--ink-2)}
  .due{
    font-family:var(--mono);font-size:12px;
    font-variant-numeric:tabular-nums;color:var(--ink-2);
  }
  .due .rel{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
  .due.soon{color:var(--urgent);font-weight:500}
  .due.soon .rel{color:var(--urgent);opacity:.8}

  .chip{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.3px;
    padding:5px 0;border-radius:5px;border:1px solid transparent;
    cursor:pointer;text-align:center;width:100%;
    background:var(--skip-soft);color:var(--muted);
    transition:background .12s,color .12s;
  }
  .chip:hover{border-color:var(--line)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip.pending{background:var(--accent-soft);color:var(--accent)}
  .chip.applied{background:var(--ok-soft);color:var(--ok)}
  .chip.opening{background:var(--warn-soft);color:var(--warn)}
  .chip.skip{background:var(--skip-soft);color:var(--muted);text-decoration:line-through}

  .foot{
    margin-top:38px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);display:flex;
    justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .save{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .save.on{color:var(--ok)}
  .save.err{color:var(--urgent)}

  @media (max-width:720px){
    .wrap{padding:22px 14px 56px}
    .row{grid-template-columns:3px minmax(0,1fr) 88px;row-gap:8px}
    .city{grid-column:2;font-size:12px}
    .due{grid-column:3;text-align:right}
    .chip{grid-column:3;grid-row:1}
    .who{grid-row:1;grid-column:2}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">
  <header class="masthead">
    <div>
      <h1>2027 届秋招投递清单</h1>
      <p class="sub">艺术学硕士 · 北京／上海／广州／深圳／南京／杭州</p>
    </div>
    <div class="updated">
      <b id="today"></b>
      清单更新于 <span id="updated"></span>
    </div>
  </header>

  <section class="summary" id="summary"></section>
  <section class="alerts" id="alerts"></section>
  <main id="groups"></main>

  <footer class="foot">
    <span>点击右侧状态可切换：待投 → 已投 → 不投。改动保存在你自己的浏览器里，换设备不会同步。</span>
    <span class="save" id="save">状态保存在本机</span>
  </footer>
</div>

<script>
(function(){
  "use strict";

  var GROUPS = [
    {id:"xd",     title:"上海选调（已开放）", hint:"235 个岗位里，专业不限且政治面貌符合的只有这 7 个；另有 25 个专业不限但卡党员。报名需经所在高校推荐，校内截止通常早于公告"},
    {id:"live",   title:"进行中",     hint:"东才计划正式岗全程限投 3 次，实习岗额度独立"},
    {id:"oct",    title:"开放投递",   hint:"10 月陆续截止，按截止日先后处理"},
    {id:"net",    title:"互联网与文娱", hint:"多数招满即止，别等截止日；4A 与公关公司无秋招，走实习转正"},
    {id:"soe",    title:"央国企职能岗", hint:"党群、行政、宣传、人力这类岗位专业目录常写「艺术学」或不限，竞争小于业务岗"},
    {id:"soon",   title:"即将开放",   hint:"盯公告发布，报名窗口只有 5—15 天且不补报"},
    {id:"exam",   title:"考试路径",   hint:"选调、国考、省考、事业单位——需提前备考，12 月上旬三地省考笔试撞车"},
    {id:"spring", title:"明年春季",   hint:"文艺院团按事业单位节奏走，主战场在 2027 年 3—5 月"}
  ];
  var CYCLE = {pending:"applied", applied:"skip", skip:"pending", opening:"applied"};
  var LABEL = {pending:"待投", applied:"已投", skip:"不投", opening:"待开放"};

  var stateEl = document.getElementById("app-state");
  var state = JSON.parse(stateEl.textContent);

  function daysTo(d){
    if(!d) return null;
    var t = new Date(d + "T23:59:59");
    if(isNaN(t)) return null;
    return Math.ceil((t - new Date()) / 86400000);
  }

  function render(){
    var jobs = state.jobs;

    // ---- summary ----
    var applied = jobs.filter(function(j){return j.status==="applied";}).length;
    var pending = jobs.filter(function(j){return j.status==="pending";}).length;
    var opening = jobs.filter(function(j){return j.status==="opening";}).length;
    var soon = jobs.filter(function(j){
      var d = daysTo(j.due);
      return j.status!=="applied" && j.status!=="skip" && d!==null && d>=0 && d<=14;
    }).length;

    document.getElementById("summary").innerHTML =
      stat(applied,"已投递","is-applied") +
      stat(pending,"待投递","is-pending") +
      stat(opening,"待开放","") +
      stat(soon,"14 天内截止","is-soon") +
      stat(jobs.length,"清单总数","");

    // ---- alerts ----
    var alerts = [];
    var emAppliedCount = jobs.filter(function(j){
      return j.org.indexOf("东方财富")===0 && j.status==="applied" && j.role.indexOf("实习")<0;
    }).length;
    alerts.push('<div class="alert quota"><span class="tag">限投</span>' +
      '<span>东方财富东才计划正式岗全程只能投 <b>3</b> 个，当前已投 <b>' + emAppliedCount +
      '</b>／3。实习岗额度独立，不占用。</span></div>');

    var urgent = jobs.filter(function(j){
      var d = daysTo(j.due);
      return j.status!=="applied" && j.status!=="skip" && d!==null && d>=0 && d<=30;
    }).sort(function(a,b){return daysTo(a.due)-daysTo(b.due);});
    if(urgent.length){
      var u = urgent[0];
      alerts.push('<div class="alert soon"><span class="tag">最近截止</span>' +
        '<span>' + esc(u.org) + ' <b>' + esc(u.role) + '</b> 还有 <b>' + daysTo(u.due) +
        '</b> 天（' + u.due + '）。30 天内共 ' + urgent.length + ' 个待处理。</span></div>');
    }
    document.getElementById("alerts").innerHTML = alerts.join("");

    // ---- groups ----
    var html = "";
    GROUPS.forEach(function(g){
      var list = jobs.filter(function(j){return j.g===g.id;});
      if(!list.length) return;
      var pri = {high:0, mid:1, low:2};
      list.sort(function(a,b){
        var da = daysTo(a.due), db = daysTo(b.due);
        if(da!==null && db!==null && da!==db) return da-db;
        if(da!==null && db===null) return -1;
        if(da===null && db!==null) return 1;
        return pri[a.pri]-pri[b.pri];
      });
      html += '<section class="group"><div class="group-head">' +
        '<h2>' + g.title + '</h2><span class="count">' + list.length + ' 个</span>' +
        '<span class="hint">' + g.hint + '</span></div><div class="rows">' +
        list.map(row).join("") + '</div></section>';
    });
    document.getElementById("groups").innerHTML = html;

    document.getElementById("updated").textContent = state.updated;
    var now = new Date();
    document.getElementById("today").textContent =
      now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate());
  }

  function stat(n,k,cls){
    return '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="k">' + k + '</div></div>';
  }

  function row(j){
    var i = state.jobs.indexOf(j);
    var d = daysTo(j.due);
    var isSoon = d!==null && d>=0 && d<=14 && j.status!=="applied" && j.status!=="skip";
    var dueHtml = j.due
      ? '<div class="due' + (isSoon?" soon":"") + '">' + j.due +
        '<span class="rel">' + (d<0 ? "已过期" : "剩 " + d + " 天") + '</span></div>'
      : '<div class="due">—<span class="rel">待定</span></div>';
    var roleHtml = j.url
      ? '<a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.role) + '</a>'
      : esc(j.role);
    return '<div class="row ' + (j.status==="applied"?"done":"") + (j.status==="skip"?"skipped":"") + '">' +
      '<div class="pri ' + j.pri + '"></div>' +
      '<div class="who"><div class="org">' + esc(j.org) + '</div>' +
      '<div class="role">' + roleHtml + '</div>' +
      '<div class="why">' + esc(j.why) + '</div></div>' +
      '<div class="city">' + esc(j.city) + '</div>' +
      dueHtml +
      '<button class="chip ' + j.status + '" data-i="' + i + '">' + LABEL[j.status] + '</button>' +
      '</div>';
  }

  function pad(n){return n<10?"0"+n:""+n;}
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  // ---- interaction ----
  document.getElementById("groups").addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if(!btn) return;
    var j = state.jobs[+btn.dataset.i];
    j.status = CYCLE[j.status] || "pending";
    var now = new Date();
    state.updated = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate());
    render();
    save();
  });

  // ---- persistence (localStorage: per-browser, not shared) ----
  var KEY = "job-tracker-2027";
  var saveEl = document.getElementById("save");

  try{
    var cached = localStorage.getItem(KEY);
    if(cached){
      var parsed = JSON.parse(cached);
      if(parsed && Array.isArray(parsed.jobs) && parsed.jobs.length === state.jobs.length){
        state.jobs.forEach(function(j, idx){
          var was = parsed.jobs[idx];
          if(was && was.role === j.role && was.status) j.status = was.status;
        });
        state.updated = parsed.updated || state.updated;
      }
    }
  }catch(e){ /* private mode or blocked storage: fall back to defaults */ }

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      saveEl.textContent = "已保存到本机浏览器";
      saveEl.className = "save on";
    }catch(e){
      saveEl.textContent = "此浏览器不允许保存，刷新后会重置";
      saveEl.className = "save err";
    }
  }

  render();
})();
</script>
