<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2027 秋招投递清单</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#f5f7fa;
    --surface:#ffffff;
    --surface-2:#fafbfd;
    --ink:#171a2b;
    --ink-2:#474d63;
    --muted:#79809a;
    --line:#e2e6ef;
    --line-2:#eef1f7;
    --accent:#2f4b7c;
    --accent-soft:#e9eef7;
    --urgent:#a93c10;
    --urgent-soft:#fbeae2;
    --ok:#26644a;
    --ok-soft:#e2efe8;
    --warn:#7d5a10;
    --warn-soft:#f7efd9;
    --skip-soft:#eef0f4;
    --shadow:0 1px 2px rgba(23,26,43,.05), 0 8px 24px -12px rgba(23,26,43,.18);
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0e1017;
      --surface:#171a24;
      --surface-2:#1c202b;
      --ink:#e7eaf3;
      --ink-2:#aeb5c8;
      --muted:#7a8195;
      --line:#282d3b;
      --line-2:#222733;
      --accent:#93aeda;
      --accent-soft:#1d2534;
      --urgent:#e5825e;
      --urgent-soft:#2d1a13;
      --ok:#79bf99;
      --ok-soft:#14261e;
      --warn:#d2af66;
      --warn-soft:#282113;
      --skip-soft:#20242f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0e1017;
    --surface:#171a24;
    --surface-2:#1c202b;
    --ink:#e7eaf3;
    --ink-2:#aeb5c8;
    --muted:#7a8195;
    --line:#282d3b;
    --line-2:#222733;
    --accent:#93aeda;
    --accent-soft:#1d2534;
    --urgent:#e5825e;
    --urgent-soft:#2d1a13;
    --ok:#79bf99;
    --ok-soft:#14261e;
    --warn:#d2af66;
    --warn-soft:#282113;
    --skip-soft:#20242f;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:32px 24px 72px}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    gap:24px;flex-wrap:wrap;
    padding-bottom:18px;border-bottom:2px solid var(--ink);
  }
  h1{
    margin:0;font-size:27px;font-weight:600;letter-spacing:-.4px;
    text-wrap:balance;
  }
  .sub{margin:5px 0 0;color:var(--muted);font-size:13px}
  .updated{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    text-align:right;line-height:1.5;
  }
  .updated b{display:block;color:var(--ink-2);font-weight:500;font-size:12px}

  /* ---------- summary ---------- */
  .summary{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:1px;background:var(--line);border:1px solid var(--line);
    margin:22px 0 0;border-radius:8px;overflow:hidden;
  }
  .stat{background:var(--surface);padding:14px 16px}
  .stat .n{
    font-family:var(--mono);font-size:24px;font-weight:600;
    line-height:1.1;font-variant-numeric:tabular-nums;
  }
  .stat .k{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
  .stat.is-applied .n{color:var(--ok)}
  .stat.is-pending .n{color:var(--accent)}
  .stat.is-soon .n{color:var(--urgent)}

  /* ---------- alerts ---------- */
  .alerts{margin:16px 0 0;display:flex;flex-direction:column;gap:8px}
  .alert{
    display:flex;gap:10px;align-items:baseline;
    padding:11px 14px;border-radius:7px;font-size:13px;
    border-left:3px solid;
  }
  .alert.quota{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .alert.soon{background:var(--urgent-soft);border-color:var(--urgent);color:var(--urgent)}
  .alert .tag{
    font-family:var(--mono);font-size:10.5px;font-weight:600;
    letter-spacing:.6px;text-transform:uppercase;flex-shrink:0;opacity:.85;
  }
  .alert span{color:var(--ink-2)}
  .alert.quota span,.alert.soon span{color:inherit;opacity:.92}

  /* ---------- todos ---------- */
  .todos{
    margin:18px 0 0;border:1px solid var(--line);border-radius:8px;
    background:var(--surface);overflow:hidden;
  }
  .todos-head{
    display:flex;align-items:baseline;gap:10px;
    padding:11px 14px;border-bottom:1px solid var(--line);
    background:var(--surface-2);
  }
  .todos-head h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:.2px}
  .todos-head .done-of{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .todos-head .hint{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .todo{
    display:grid;grid-template-columns:22px minmax(0,1fr) auto;
    gap:0 10px;align-items:start;
    padding:10px 14px;border-bottom:1px solid var(--line-2);
    cursor:pointer;
  }
  .todo:last-child{border-bottom:0}
  .todo:hover{background:var(--surface-2)}
  .todo .box{
    width:15px;height:15px;margin-top:2px;border-radius:4px;
    border:1.5px solid var(--line);background:transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#fff;line-height:1;
  }
  .todo.on .box{background:var(--ok);border-color:var(--ok)}
  .todo .t{font-size:13.5px;color:var(--ink);line-height:1.5}
  .todo .n{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
  .todo .n a{color:var(--accent)}
  .todo .when{
    font-family:var(--mono);font-size:11px;white-space:nowrap;
    padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);
  }
  .todo .when.now{background:var(--urgent-soft);color:var(--urgent);font-weight:500}
  .todo.on .t{text-decoration:line-through;color:var(--muted)}
  .todo.on .n,.todo.on .when{opacity:.5}

  /* ---------- filters ---------- */
  .filters{
    margin:18px 0 0;padding:12px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;
    display:flex;flex-direction:column;gap:9px;
  }
  .frow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .flabel{
    font-size:11px;color:var(--muted);letter-spacing:.4px;
    width:34px;flex-shrink:0;
  }
  .fchip{
    font-size:12.5px;padding:4px 11px;border-radius:20px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-2);
    font-family:inherit;
  }
  .fchip:hover{border-color:var(--accent);color:var(--accent)}
  .fchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .fchip.on,
  :root:not([data-theme="light"]) .fchip.on{color:var(--paper)}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]) .fchip.on{color:#fff}
  }
  .fcount{
    margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .empty{
    padding:36px 16px;text-align:center;color:var(--muted);font-size:13px;
  }

  /* ---------- groups ---------- */
  .group{margin-top:34px}
  .group-head{
    display:flex;align-items:baseline;gap:10px;
    padding-bottom:8px;margin-bottom:0;
    border-bottom:1px solid var(--line);
  }
  .group-head h2{
    margin:0;font-size:14.5px;font-weight:600;letter-spacing:.1px;
  }
  .group-head .count{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .group-head .hint{
    margin-left:auto;font-size:12px;color:var(--muted);
  }

  .rows{display:flex;flex-direction:column}
  .row{
    display:grid;
    grid-template-columns:3px minmax(0,1fr) 84px 96px 92px;
    gap:0 14px;align-items:center;
    padding:11px 12px 11px 0;
    border-bottom:1px solid var(--line-2);
    background:var(--surface);
  }
  .row:hover{background:var(--surface-2)}
  .row.done{opacity:.62}
  .row.skipped{opacity:.42}

  .pri{align-self:stretch;border-radius:2px;background:transparent}
  .pri.high{background:var(--accent)}
  .pri.mid{background:var(--line)}
  .pri.low{background:transparent}

  .who{min-width:0;padding-left:11px}
  .org{font-size:11.5px;color:var(--muted);letter-spacing:.15px}
  .role{
    font-size:14px;font-weight:500;color:var(--ink);
    margin-top:1px;overflow-wrap:anywhere;
  }
  .role a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
  .role a:hover{border-color:var(--accent);color:var(--accent)}
  .why{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}

  .city{font-size:12.5px;color:var(--ink-2)}
  .due{
    font-family:var(--mono);font-size:12px;
    font-variant-numeric:tabular-nums;color:var(--ink-2);
  }
  .due .rel{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
  .due.soon{color:var(--urgent);font-weight:500}
  .due.soon .rel{color:var(--urgent);opacity:.8}

  .chip{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.3px;
    padding:5px 0;border-radius:5px;border:1px solid transparent;
    cursor:pointer;text-align:center;width:100%;
    background:var(--skip-soft);color:var(--muted);
    transition:background .12s,color .12s;
  }
  .chip:hover{border-color:var(--line)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip.pending{background:var(--accent-soft);color:var(--accent)}
  .chip.applied{background:var(--ok-soft);color:var(--ok)}
  .chip.opening{background:var(--warn-soft);color:var(--warn)}
  .chip.skip{background:var(--skip-soft);color:var(--muted);text-decoration:line-through}

  .foot{
    margin-top:38px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);display:flex;
    justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .save{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .save.on{color:var(--ok)}
  .save.err{color:var(--urgent)}

  @media (max-width:720px){
    .wrap{padding:22px 14px 56px}
    .row{grid-template-columns:3px minmax(0,1fr) 88px;row-gap:8px}
    .city{grid-column:2;font-size:12px}
    .due{grid-column:3;text-align:right}
    .chip{grid-column:3;grid-row:1}
    .who{grid-row:1;grid-column:2}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  ];
  var CYCLE = {pending:"applied", applied:"skip", skip:"pending", opening:"applied"};

  var CITIES = ["北京", "上海", "广州", "深圳", "南京", "杭州"];

  function matchCity(j){
    if(filters.city === "all") return true;
    // "六城均有" / "全国" style entries apply to every city
    if(/六城|全国|各地|待筛选|待定/.test(j.city)) return true;
    return j.city.indexOf(filters.city) !== -1;
  }
  function matchStatus(j){
    return filters.status === "all" || j.status === filters.status;
  }
  function matchSoon(j){
    if(!filters.soon) return true;
    var d = daysTo(j.due);
    return d !== null && d >= 0 && d <= 30;
  }
  function visible(j){ return matchCity(j) && matchStatus(j) && matchSoon(j); }

  var stateEl = document.getElementById("app-state");
  var state = JSON.parse(stateEl.textContent);

  function daysTo(d){
    if(!d) return null;
    var t = new Date(d + "T23:59:59");
    if(isNaN(t)) return null;
    return Math.ceil((t - new Date()) / 86400000);
  }

    var applied = jobs.filter(function(j){return j.status==="applied";}).length;

      var d = daysTo(j.due);
      return j.status!=="applied" && j.status!=="skip" && d!==null && d>=0 && d<=14;
    }).length;

    document.getElementById("summary").innerHTML =
      stat(applied,"已投递","is-applied") +
      stat(pending,"待投递","is-pending") +
      stat(opening,"待开放","") +
      stat(soon,"14 天内截止","is-soon") +
      stat(jobs.length,"清单总数","");

    // ---- alerts ----
    var alerts = [];
    var emAppliedCount = jobs.filter(function(j){
      return j.org.indexOf("东方财富")===0 && j.status==="applied" && j.role.indexOf("实习")<0;
    }).length;

      '<span>东方财富东才计划正式岗全程只能投 <b>3</b> 个，当前已投 <b>' + emAppliedCount +

    var urgent = jobs.filter(function(j){
      var d = daysTo(j.due);
      return j.status!=="applied" && j.status!=="skip" && d!==null && d>=0 && d<=30;
    }).sort(function(a,b){return daysTo(a.due)-daysTo(b.due);});
    if(urgent.length){
      var u = urgent[0];
      alerts.push('<div class="alert soon"><span class="tag">最近截止</span>' +

        '</b> 天（' + u.due + '）。30 天内共 ' + urgent.length + ' 个待处理。</span></div>');

    var todos = state.todos || [];
    var left = todos.filter(function(x){ return !x.done; }).length;
    var URGENT = /今晚|今明|本周/;
    var th = '<div class="todos-head"><h2>待办</h2>' +
      '<span class="done-of">' + (todos.length - left) + ' / ' + todos.length + ' 已完成</span>' +
      '<span class="hint">点一行标记完成</span></div>';
    todos.forEach(function(x, i){
      th += '<div class="todo' + (x.done ? " on" : "") + '" data-todo="' + i + '">' +
        '<div class="box">' + (x.done ? "✓" : "") + '</div>' +
        '<div><div class="t">' + esc(x.t) + '</div>' +
        (x.n ? '<div class="n">' + linkify(x.n) + '</div>' : '') + '</div>' +
        '<span class="when' + (!x.done && URGENT.test(x.when) ? " now" : "") + '">' +
        esc(x.when) + '</span></div>';
    });
    document.getElementById("todos").innerHTML = th;

    // ---- filter bar ----
    var shown = jobs.filter(visible).length;
    var fh = '<div class="frow"><span class="flabel">城市</span>' +
      fchip("city", "all", "全部");
    CITIES.forEach(function(c){ fh += fchip("city", c, c); });
    fh += '<span class="fcount">显示 ' + shown + ' / ' + jobs.length + '</span></div>';

    fh += '<div class="frow"><span class="flabel">状态</span>' +
      fchip("status", "all", "全部") +
      fchip("status", "pending", "待投") +
      fchip("status", "applied", "已投") +
      fchip("status", "opening", "待开放") +
      fchip("status", "skip", "不投") +
      '<button class="fchip' + (filters.soon ? " on" : "") +
      '" data-f="soon" data-v="toggle">30 天内截止</button></div>';
    document.getElementById("filters").innerHTML = fh;

    // ---- groups ----
    var html = "";
    GROUPS.forEach(function(g){
      var list = jobs.filter(function(j){return j.g===g.id && visible(j);});
      if(!list.length) return;
      var pri = {high:0, mid:1, low:2};
      list.sort(function(a,b){
        var da = daysTo(a.due), db = daysTo(b.due);
        if(da!==null && db!==null && da!==db) return da-db;
        if(da!==null && db===null) return -1;
        if(da===null && db!==null) return 1;
        return pri[a.pri]-pri[b.pri];
      });
      html += '<section class="group"><div class="group-head">' +
        '<h2>' + g.title + '</h2><span class="count">' + list.length + ' 个</span>' +
        '<span class="hint">' + g.hint + '</span></div><div class="rows">' +
        list.map(row).join("") + '</div></section>';
    });
    document.getElementById("groups").innerHTML = html ||
      '<div class="empty">这些条件下没有岗位。放宽城市或状态再看看。</div>';

    document.getElementById("updated").textContent = state.updated;
    var now = new Date();
    document.getElementById("today").textContent =
      now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate());
  }

  function stat(n,k,cls){
    return '<div class="stat ' + cls + '"><div class="n">' + n + '</div><div class="k">' + k + '</div></div>';
  }

  function linkify(t){
    // escape first, then turn bare URLs into links
    return esc(t).replace(/https?:\/\/[^\s，。）)]+/g, function(u){
      return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>';
    });
  }

  function fchip(field, value, label){
    var on = filters[field] === value;
    return '<button class="fchip' + (on ? " on" : "") + '" data-f="' + field +
      '" data-v="' + esc(value) + '">' + esc(label) + '</button>';
  }

  function row(j){
    var i = state.jobs.indexOf(j);
    var d = daysTo(j.due);
    var isSoon = d!==null && d>=0 && d<=14 && j.status!=="applied" && j.status!=="skip";
    var dueHtml = j.due
      ? '<div class="due' + (isSoon?" soon":"") + '">' + j.due +
        '<span class="rel">' + (d<0 ? "已过期" : "剩 " + d + " 天") + '</span></div>'
      : '<div class="due">—<span class="rel">待定</span></div>';
    var roleHtml = j.url
      ? '<a href="' + esc(j.url) + '" target="_blank" rel="noopener">' + esc(j.role) + '</a>'
      : esc(j.role);
    return '<div class="row ' + (j.status==="applied"?"done":"") + (j.status==="skip"?"skipped":"") + '">' +
      '<div class="pri ' + j.pri + '"></div>' +
      '<div class="who"><div class="org">' + esc(j.org) + '</div>' +
      '<div class="role">' + roleHtml + '</div>' +
      '<div class="why">' + esc(j.why) + '</div></div>' +
      '<div class="city">' + esc(j.city) + '</div>' +
      dueHtml +
      '<button class="chip ' + j.status + '" data-i="' + i + '">' + LABEL[j.status] + '</button>' +
      '</div>';
  }

  function pad(n){return n<10?"0"+n:""+n;}
  function stampUpdated(){
    var now = new Date();
    state.updated = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate());
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  // ---- todos: part of saved state ----
  document.getElementById("todos").addEventListener("click", function(e){
    var row = e.target.closest(".todo");
    if(!row) return;
    var t = state.todos[+row.dataset.todo];
    t.done = !t.done;
    stampUpdated();
    render();
    save();
  });

  // ---- filters (view-only, never saved) ----
  document.getElementById("filters").addEventListener("click", function(e){
    var btn = e.target.closest(".fchip");
    if(!btn) return;
    var f = btn.dataset.f;
    if(f === "soon") filters.soon = !filters.soon;
    else filters[f] = btn.dataset.v;
    render();
  });

  // ---- interaction ----
  document.getElementById("groups").addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if(!btn) return;
    var j = state.jobs[+btn.dataset.i];
    j.status = CYCLE[j.status] || "pending";
    stampUpdated();
    render();
    save();
  });

  // ---- persistence (localStorage: per-browser, not shared) ----
  var KEY = "job-tracker-2027";
  var saveEl = document.getElementById("save");

  try{
    var cached = localStorage.getItem(KEY);
    if(cached){
      var parsed = JSON.parse(cached);
      if(parsed && Array.isArray(parsed.jobs) && parsed.jobs.length === state.jobs.length){
        state.jobs.forEach(function(j, idx){
          var was = parsed.jobs[idx];
          if(was && was.role === j.role && was.status) j.status = was.status;
        });
        state.updated = parsed.updated || state.updated;
      }
      if(parsed && Array.isArray(parsed.todos) && Array.isArray(state.todos)){
        state.todos.forEach(function(t){
          var was = parsed.todos.filter(function(x){ return x.t === t.t; })[0];
          if(was) t.done = !!was.done;
        });
      }
    }
  }catch(e){ /* private mode or blocked storage: fall back to defaults */ }

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      saveEl.textContent = "已保存到本机浏览器";
      saveEl.className = "save on";
    }catch(e){
      saveEl.textContent = "此浏览器不允许保存，刷新后会重置";
      saveEl.className = "save err";
    }
  }

  render();
})();
</script>

</body>
</html>
